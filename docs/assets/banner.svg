<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 340" width="1280" height="340" role="img" aria-labelledby="title desc">
  <title id="title">PrintShelf — a local-first 3D print catalogue</title>
  <desc id="desc">Dark green and navy banner with an isometric 3D cube and the PrintShelf wordmark.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b14"/>
      <stop offset="0.62" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#10221d"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.72" cy="0.28" r="0.62">
      <stop offset="0" stop-color="#34d399" stop-opacity="0.22"/>
      <stop offset="0.55" stop-color="#22d3ee" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#94a3b8" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1280" height="340" rx="22" fill="url(#bg)"/>
  <rect width="1280" height="340" rx="22" fill="url(#grid)"/>
  <rect width="1280" height="340" rx="22" fill="url(#glow)"/>
  <rect x="1" y="1" width="1278" height="338" rx="21" fill="none" stroke="#334155" stroke-opacity="0.55"/>

  <!-- isometric cube -->
  <g transform="translate(92 78)" fill="none" stroke-linejoin="round" stroke-linecap="round">
    <path d="M94 8 176 54 94 100 12 54Z" fill="#10b981" fill-opacity="0.10" stroke="url(#edge)" stroke-width="3" filter="url(#softGlow)"/>
    <path d="M12 54 94 100 94 184 12 138Z" fill="#0ea5e9" fill-opacity="0.08" stroke="#38bdf8" stroke-opacity="0.8" stroke-width="2.5"/>
    <path d="M176 54 94 100 94 184 176 138Z" fill="#34d399" fill-opacity="0.05" stroke="#5eead4" stroke-opacity="0.75" stroke-width="2.5"/>
    <path d="M53 31 135 77M53 77 135 123M53 123 135 169" stroke="#94a3b8" stroke-opacity="0.18" stroke-width="1.2"/>
    <circle cx="94" cy="100" r="5.5" fill="#a7f3d0" stroke="none" filter="url(#softGlow)"/>
  </g>

  <g font-family="Segoe UI, Inter, Arial, sans-serif">
    <text x="330" y="128" fill="#5eead4" font-size="18" font-weight="700" letter-spacing="4">LOCAL-FIRST 3D PRINT CATALOGUE</text>
    <text x="324" y="222" fill="#f8fafc" font-size="88" font-weight="700" letter-spacing="-2">PrintShelf</text>
    <text x="330" y="270" fill="#94a3b8" font-size="26" font-weight="400">Your STL library, finally in its place.</text>
    <text x="331" y="310" fill="#64748b" font-size="16" font-weight="600" letter-spacing="1.5">BLAZOR SERVER  ·  POSTGRESQL  ·  THREE.JS</text>
  </g>

  <g transform="translate(1132 96)">
    <circle cx="0" cy="0" r="46" fill="#10b981" fill-opacity="0.10" stroke="#34d399" stroke-opacity="0.35"/>
    <path d="M-17 5 0 -5 17 5 0 15Z" fill="#5eead4" fill-opacity="0.9"/>
    <path d="M-17 5 -17 21 0 31 0 15Z" fill="#38bdf8" fill-opacity="0.8"/>
    <path d="M17 5 17 21 0 31 0 15Z" fill="#34d399" fill-opacity="0.65"/>
  </g>
</svg>
